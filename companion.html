  <style>
:root {
  --red: #b91c1c;
  --red-deep: #7f1d1d;
  --gold: #d4a017;
  --gold-soft: #f0d78c;
  --cream: #fff9f0;
  --ink: #1c1410;
  --ink-soft: #4a3f36;
  --card: #fffdf8;
  --border: #e8d9c0;
  --ok: #166534;
  --warn-bg: #fff7ed;
  --warn-border: #fdba74;
  --banner: #1e3a5f;
  --shadow: 0 4px 16px rgba(185, 28, 28, 0.08), 0 1px 4px rgba(28, 20, 16, 0.06);
  --radius: 18px;
  --tap: 54px;
  --font: "Segoe UI", system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --day-1: #fef2f2;
  --day-2: #fff7ed;
  --day-3: #fefce8;
  --day-4: #f0fdf4;
  --day-5: #eff6ff;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 1.05rem;
  background: var(--cream);
  color: var(--ink);
  line-height: 1.5;
  min-height: 100dvh;
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}

a { color: var(--red-deep); }
button, input, textarea, select {
  font: inherit;
  color: inherit;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: linear-gradient(135deg, var(--red-deep), var(--red) 55%, #c2410c);
  color: #fff;
  padding: 14px 16px 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,.22);
}
.app-header h1 {
  margin: 0;
  font-size: 1.2rem;
  letter-spacing: 0.02em;
  font-weight: 800;
}
.app-header .tagline {
  margin: 4px 0 0;
  font-size: 0.88rem;
  opacity: 0.95;
  font-weight: 500;
}
.header-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: var(--tap);
  padding: 0 16px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  text-decoration: none;
  font-weight: 700;
  font-size: 0.95rem;
}
.btn-primary {
  background: var(--gold);
  color: var(--ink);
}
.btn-primary:hover, .btn-primary:focus-visible {
  background: var(--gold-soft);
  outline: 2px solid #fff;
  outline-offset: 2px;
}
.btn-ghost {
  background: rgba(255,255,255,.15);
  color: #fff;
  border: 1px solid rgba(255,255,255,.35);
}
.btn-ghost:hover, .btn-ghost:focus-visible {
  background: rgba(255,255,255,.28);
  outline: 2px solid #fff;
  outline-offset: 2px;
}
.btn-sm {
  min-height: 40px;
  padding: 0 12px;
  font-size: 0.85rem;
}
.btn-icon {
  min-width: var(--tap);
  min-height: var(--tap);
  padding: 0;
  border-radius: 14px;
  background: transparent;
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 1.25rem;
}
.btn-icon[aria-pressed="true"] {
  background: #fef3c7;
  border-color: var(--gold);
}

.banner {
  background: var(--banner);
  color: #e8eef6;
  padding: 10px 16px;
  font-size: 0.88rem;
  text-align: center;
}
.banner strong { color: #fff; }

.nav-tabs {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 50;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 2px;
  background: #fff;
  border-top: 2px solid var(--gold-soft);
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  box-shadow: 0 -6px 20px rgba(0,0,0,.08);
}
.nav-tabs button {
  appearance: none;
  border: none;
  background: transparent;
  min-height: 56px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--ink-soft);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
}
.nav-tabs button .ico { font-size: 1.5rem; line-height: 1; }
.nav-tabs button[aria-selected="true"] {
  color: var(--red);
  background: #fef2f2;
}
.nav-tabs button:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 1px;
}

main {
  max-width: 640px;
  margin: 0 auto;
  padding: 14px 14px 24px;
}
.panel { display: none; }
.panel.active { display: block; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.card h2, .card h3 {
  margin: 0 0 8px;
  font-size: 1.1rem;
}
.muted { color: var(--ink-soft); font-size: 0.92rem; }
.pill {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  vertical-align: middle;
}
.pill-booked { background: #dcfce7; color: var(--ok); }
.pill-planned { background: #fef3c7; color: #92400e; }
.pill-plan { background: #e0e7ff; color: #3730a3; }

.callout {
  background: var(--warn-bg);
  border: 1px solid var(--warn-border);
  border-radius: 14px;
  padding: 12px 14px;
  margin: 10px 0;
  font-size: 0.92rem;
}
.callout a { word-break: break-all; }

.countdown {
  text-align: center;
  padding: 24px 14px;
  background: linear-gradient(165deg, #fff7ed 0%, var(--card) 55%, #fef2f2 100%);
  border: 2px solid var(--gold-soft);
}
.countdown .big {
  font-size: 3.2rem;
  font-weight: 900;
  color: var(--red);
  line-height: 1.05;
  text-shadow: 0 2px 0 var(--gold-soft);
}
.countdown .countdown-label {
  font-size: 1.15rem;
  font-weight: 800;
  margin: 6px 0 4px;
  color: var(--red-deep);
}
.day-title-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
}
.day-title-row h2 { margin: 0; flex: 1; }

.item {
  border-top: 1px solid var(--border);
  padding: 14px 0 12px;
  position: relative;
}
.item:first-of-type { border-top: none; padding-top: 4px; }
.item.done .item-title { text-decoration: line-through; opacity: 0.65; }
.item.done::after {
  content: "★";
  position: absolute;
  top: 10px;
  right: 4px;
  font-size: 1.35rem;
  color: var(--gold);
  animation: stamp-pop 0.35s ease-out;
  pointer-events: none;
}
@keyframes stamp-pop {
  0% { transform: scale(0.3) rotate(-20deg); opacity: 0; }
  60% { transform: scale(1.25) rotate(8deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
.item-top {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.item-checks {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
}
.item-body { flex: 1; min-width: 0; }
.item-title { font-weight: 700; font-size: 1.02rem; }
.item-detail { font-size: 0.92rem; color: var(--ink-soft); margin-top: 2px; }
.item-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.item-note {
  width: 100%;
  margin-top: 8px;
  min-height: 44px;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  background: #fff;
  resize: vertical;
}
.chk {
  width: 36px;
  height: 36px;
  accent-color: var(--red);
  cursor: pointer;
}

.day-picker {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 12px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.day-chip {
  flex: 0 0 auto;
  min-width: 68px;
  min-height: var(--tap);
  padding: 8px 12px;
  border-radius: 16px;
  border: 2px solid var(--border);
  background: #fff;
  cursor: pointer;
  text-align: center;
  font-size: 0.78rem;
  font-weight: 700;
}
.day-chip:nth-child(5n+1) { background: var(--day-1); }
.day-chip:nth-child(5n+2) { background: var(--day-2); }
.day-chip:nth-child(5n+3) { background: var(--day-3); }
.day-chip:nth-child(5n+4) { background: var(--day-4); }
.day-chip:nth-child(5n+5) { background: var(--day-5); }
.day-chip .d { display: block; font-size: 1.1rem; font-weight: 800; color: var(--red); }
.day-chip[aria-selected="true"] {
  background: var(--red);
  color: #fff;
  border-color: var(--red-deep);
  box-shadow: 0 3px 10px rgba(185, 28, 28, 0.25);
}
.day-chip[aria-selected="true"] .d { color: var(--gold-soft); }

.search-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.search-row input {
  flex: 1;
  min-height: var(--tap);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 0 16px;
  background: #fff;
  font-size: 1rem;
}
.cat-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 10px;
  -webkit-overflow-scrolling: touch;
}
.cat-chip {
  flex: 0 0 auto;
  min-height: 40px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: #fff;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.cat-chip[aria-selected="true"] {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
}

.phrase-grid {
  display: grid;
  gap: 12px;
}
.phrase-card {
  perspective: 800px;
  min-height: 140px;
  cursor: pointer;
  border: none;
  padding: 0;
  background: transparent;
  text-align: left;
  width: 100%;
}
.phrase-inner {
  position: relative;
  width: 100%;
  min-height: 140px;
  transition: transform 0.45s;
  transform-style: preserve-3d;
}
.phrase-card.flipped .phrase-inner { transform: rotateY(180deg); }
.phrase-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: var(--radius);
  border: 2px solid var(--border);
  background: var(--card);
  box-shadow: var(--shadow);
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.phrase-face.front {
  background: linear-gradient(165deg, #fff 0%, #fff7ed 100%);
  border-color: var(--gold-soft);
}
.phrase-face.back {
  transform: rotateY(180deg);
  background: linear-gradient(160deg, #fef2f2, #fff);
  border-color: #fecaca;
}
.phrase-try {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--red);
  margin-bottom: 4px;
}
.phrase-ja {
  font-size: 1.45rem;
  font-weight: 800;
  line-height: 1.3;
}
.phrase-romaji {
  font-size: 0.95rem;
  color: var(--ink-soft);
  margin-top: 4px;
  font-weight: 600;
}
.phrase-en {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--red-deep);
}
.phrase-hint {
  margin-top: 10px;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--red);
  background: #fef3c7;
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  align-self: flex-start;
}
.phrase-tools {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.stay-card h3 { margin-bottom: 4px; }
.kv { font-size: 0.95rem; margin: 4px 0; }
.kv span { color: var(--ink-soft); }

.app-footer {
  max-width: 640px;
  margin: 8px auto 0;
  padding: 8px 16px 20px;
  text-align: center;
  font-size: 0.82rem;
  color: var(--ink-soft);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  border: 0;
}

@media (min-width: 640px) {
  .app-header h1 { font-size: 1.4rem; }
  .phrase-grid { grid-template-columns: 1fr 1fr; }
  .countdown .big { font-size: 3.6rem; }
}


/* Location photo thumbs → open Google Maps */
.place-photo {
  position: relative;
  display: block;
  margin: 8px 0 6px;
  width: min(100%, 280px);
  max-width: 100%;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow);
  background: #e8d9c0;
  aspect-ratio: 4 / 3;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.place-photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  vertical-align: middle;
}
.place-photo-badge {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(127, 29, 29, 0.92);
  color: #fff;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
  pointer-events: none;
}
.place-photo:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}
.place-photo:active {
  transform: scale(0.98);
}
.stay-card .place-photo {
  width: 100%;
  max-width: 420px;
  aspect-ratio: 16 / 10;
  margin: 10px 0 12px;
}
@media (max-width: 420px) {
  .place-photo {
    width: 100%;
    max-width: none;
    aspect-ratio: 16 / 10;
  }
}


.crew-list {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  display: grid;
  gap: 8px;
}
.crew-member {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 8px 12px;
  background: #fff7ed;
  border: 1px solid var(--border);
  border-radius: 14px;
  font-weight: 700;
  font-size: 1.05rem;
}
.crew-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 999px;
  background: var(--red);
  color: #fff;
  font-size: 0.9rem;
  flex-shrink: 0;
}

  </style>

(function () {
  'use strict';

  const DATA = window.TRIP_DATA;
  if (!DATA) {
    console.error('TRIP_DATA missing — run scripts/sync-data.js');
    return;
  }

  const STORAGE_KEY = 'circus-vargas-japan-v1';
  const TZ = DATA.meta.timezone || 'Asia/Tokyo';

  function loadState() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    } catch {
      return {};
    }
  }
  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }
  let state = loadState();

  function itemKey(dayId, itemId) {
    return `${dayId}::${itemId}`;
  }
  function getItemState(dayId, itemId) {
    const k = itemKey(dayId, itemId);
    return state[k] || { done: false, star: false, note: '' };
  }
  function setItemState(dayId, itemId, patch) {
    const k = itemKey(dayId, itemId);
    state[k] = { ...getItemState(dayId, itemId), ...patch };
    saveState(state);
  }

  function mapsLink(query, mapsUrl) {
    if (mapsUrl) return mapsUrl;
    if (!query) return null;
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
  }
  function searchLink(query) {
    if (!query) return null;
    return `https://www.google.com/search?q=${encodeURIComponent(query)}`;
  }

  /** Look up photo by mapsQuery (central data/photos.json — survives Doc sync). */
  function photoFor(mapsQuery) {
    if (!mapsQuery || !DATA.photos) return null;
    return DATA.photos[mapsQuery] || null;
  }

  function renderPlacePhoto(mapsQuery, mapsUrl, altTitle) {
    const photo = photoFor(mapsQuery);
    const map = mapsLink(mapsQuery, mapsUrl);
    if (!photo || !photo.file || !map) return '';
    const credit = photo.credit ? ` · ${photo.credit}` : '';
    return `
      <a class="place-photo" href="${escapeHtml(map)}" target="_blank" rel="noopener noreferrer"
         title="Open in Google Maps${escapeHtml(credit)}">
        <img src="${escapeHtml(photo.file)}" alt="${escapeHtml(altTitle || mapsQuery)}" loading="lazy" width="120" height="90" />
        <span class="place-photo-badge" aria-hidden="true">📍 Maps</span>
      </a>`;
  }

  function tokyoYmd(d = new Date()) {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: TZ,
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }).format(d);
  }

  function statusPill(status) {
    if (!status) return '';
    const s = status.toLowerCase();
    let cls = 'pill-plan';
    if (s.includes('booked')) cls = 'pill-booked';
    else if (s.includes('not ticketed') || s.includes('planned')) cls = 'pill-planned';
    return `<span class="pill ${cls}">${escapeHtml(status)}</span>`;
  }

  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function linkify(text) {
    const escaped = escapeHtml(text);
    return escaped.replace(
      /(https?:\/\/[^\s<]+)/g,
      '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
    );
  }

  function daysUntilTrip(todayYmd) {
    const start = DATA.meta.tripStart;
    const a = new Date(todayYmd + 'T12:00:00Z');
    const b = new Date(start + 'T12:00:00Z');
    return Math.round((b - a) / 86400000);
  }

  function findDay(dateStr) {
    return DATA.days.find((d) => d.date === dateStr) || null;
  }

  function renderItem(day, item) {
    const st = getItemState(day.id, item.id);
    const map = mapsLink(item.mapsQuery, item.mapsUrl);
    const search = searchLink(item.mapsQuery || item.title);
    const doneClass = st.done ? ' done' : '';
    const photoHtml = renderPlacePhoto(item.mapsQuery, item.mapsUrl, item.title);
    return `
      <article class="item${doneClass}" data-day="${escapeHtml(day.id)}" data-item="${escapeHtml(item.id)}">
        <div class="item-top">
          <div class="item-checks">
            <label title="Done!">
              <span class="sr-only">Mark done</span>
              <input class="chk js-done" type="checkbox" ${st.done ? 'checked' : ''} aria-label="Mark done!">
            </label>
            <button type="button" class="btn-icon js-star" aria-label="Favorite" aria-pressed="${st.star ? 'true' : 'false'}">${st.star ? '★' : '☆'}</button>
          </div>
          <div class="item-body">
            <div class="item-title">${escapeHtml(item.title)} ${statusPill(item.status)}</div>
            ${photoHtml}
            ${item.detail ? `<div class="item-detail">${linkify(item.detail)}</div>` : ''}
            <div class="item-actions">
              ${map ? `<a class="btn btn-sm btn-ghost" style="background:#fef2f2;color:var(--red-deep);border:1px solid var(--border)" href="${escapeHtml(map)}" target="_blank" rel="noopener noreferrer">Maps</a>` : ''}
              ${search ? `<a class="btn btn-sm btn-ghost" style="background:#fff;color:var(--ink);border:1px solid var(--border)" href="${escapeHtml(search)}" target="_blank" rel="noopener noreferrer">Search</a>` : ''}
              ${item.link ? `<a class="btn btn-sm btn-ghost" style="background:#fff;color:var(--ink);border:1px solid var(--border)" href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer">Link</a>` : ''}
            </div>
            <label class="sr-only" for="note-${escapeHtml(item.id)}">Personal note</label>
            <textarea id="note-${escapeHtml(item.id)}" class="item-note js-note" placeholder="Your note (this phone only)…" rows="1">${escapeHtml(st.note)}</textarea>
          </div>
        </div>
      </article>`;
  }

  function renderDayCard(day, opts = {}) {
    const callouts = (day.callouts || [])
      .map((c) => `<div class="callout">${linkify(c)}</div>`)
      .join('');
    const items = (day.items || []).map((it) => renderItem(day, it)).join('');
    return `
      <section class="card" ${opts.id ? `id="${escapeHtml(opts.id)}"` : ''}>
        <div class="day-title-row">
          <h2>${escapeHtml(day.title)}</h2>
        </div>
        <p class="muted">${escapeHtml(day.weekday)} · ${escapeHtml(day.date)} · ${escapeHtml(day.city || '')}</p>
        <p>${escapeHtml(day.summary || '')}</p>
        ${callouts}
        ${items}
      </section>`;
  }

  function renderToday() {
    const el = document.getElementById('panel-today');
    const today = tokyoYmd();
    const start = DATA.meta.tripStart;
    const end = DATA.meta.tripEnd;
    const day = findDay(today);

    if (today < start) {
      const n = daysUntilTrip(today);
      el.innerHTML = `
        <div class="card countdown">
          <p class="muted">Tokyo time · we leave Oct 9, 2026</p>
          <div class="big">${n}</div>
          <p class="countdown-label">${n === 1 ? 'day' : 'days'} until Japan!</p>
          <p><strong>🎪 Circus Vargas adventure countdown</strong></p>
          <p class="muted">Crew: ${escapeHtml(DATA.meta.partySize)}</p>
        </div>
        ${renderDayCard(DATA.days[0], { id: 'preview-first' })}
        <p class="muted" style="text-align:center">Peek at arrival day. Tap <strong>Days</strong> for the whole plan.</p>`;
      wireItemControls(el);
      return;
    }

    if (today > end) {
      el.innerHTML = `
        <div class="card countdown">
          <div class="big">🎪</div>
          <p class="countdown-label">Adventure complete!</p>
          <p><strong>Thanks for the memories!</strong></p>
          <p class="muted">Oct 9–18, 2026 · peek at Days anytime.</p>
        </div>`;
      return;
    }

    if (day) {
      el.innerHTML = `
        <p class="muted" style="margin:0 0 8px">Today (Tokyo time) · ${escapeHtml(today)}</p>
        ${renderDayCard(day)}`;
      wireItemControls(el);
    } else {
      el.innerHTML = `<div class="card"><p>No day entry for ${escapeHtml(today)}.</p></div>`;
    }
  }

  let selectedItinDate = null;

  function renderItinerary() {
    const el = document.getElementById('panel-itinerary');
    if (!selectedItinDate) {
      const today = tokyoYmd();
      if (today >= DATA.meta.tripStart && today <= DATA.meta.tripEnd && findDay(today)) {
        selectedItinDate = today;
      } else {
        selectedItinDate = DATA.days[0].date;
      }
    }
    const chips = DATA.days
      .map((d) => {
        const label = d.date.slice(5).replace('-', '/');
        const sel = d.date === selectedItinDate;
        return `<button type="button" class="day-chip js-day-chip" data-date="${escapeHtml(d.date)}" aria-selected="${sel}">
          <span class="d">${escapeHtml(label.split('/')[1])}</span>
          ${escapeHtml(d.weekday.slice(0, 3))}
        </button>`;
      })
      .join('');
    const day = findDay(selectedItinDate) || DATA.days[0];
    el.innerHTML = `
      <div class="day-picker" role="tablist" aria-label="All the days">${chips}</div>
      ${renderDayCard(day)}`;
    el.querySelectorAll('.js-day-chip').forEach((btn) => {
      btn.addEventListener('click', () => {
        selectedItinDate = btn.dataset.date;
        renderItinerary();
      });
    });
    wireItemControls(el);
  }

  function wireItemControls(root) {
    root.querySelectorAll('.item').forEach((article) => {
      const dayId = article.dataset.day;
      const itemId = article.dataset.item;
      const done = article.querySelector('.js-done');
      const star = article.querySelector('.js-star');
      const note = article.querySelector('.js-note');
      done.addEventListener('change', () => {
        setItemState(dayId, itemId, { done: done.checked });
        article.classList.toggle('done', done.checked);
      });
      star.addEventListener('click', () => {
        const cur = getItemState(dayId, itemId);
        const next = !cur.star;
        setItemState(dayId, itemId, { star: next });
        star.setAttribute('aria-pressed', next ? 'true' : 'false');
        star.textContent = next ? '★' : '☆';
      });
      note.addEventListener('input', () => {
        setItemState(dayId, itemId, { note: note.value });
      });
    });
  }

  let phraseCat = 'all';
  let phraseQuery = '';

  function renderPhrases() {
    const el = document.getElementById('panel-phrases');
    const cats = DATA.phrases.categories;
    const chips = [
      `<button type="button" class="cat-chip js-cat" data-cat="all" aria-selected="${phraseCat === 'all'}">All</button>`,
      ...cats.map(
        (c) =>
          `<button type="button" class="cat-chip js-cat" data-cat="${escapeHtml(c.id)}" aria-selected="${phraseCat === c.id}">${escapeHtml(c.name)}</button>`
      )
    ].join('');

    let items = cats.flatMap((c) =>
      c.items.map((it) => ({ ...it, category: c.name, catId: c.id }))
    );
    if (phraseCat !== 'all') items = items.filter((i) => i.catId === phraseCat);
    const q = phraseQuery.trim().toLowerCase();
    if (q) {
      items = items.filter(
        (i) =>
          (i.ja && i.ja.toLowerCase().includes(q)) ||
          (i.romaji && i.romaji.toLowerCase().includes(q)) ||
          (i.en && i.en.toLowerCase().includes(q)) ||
          (i.category && i.category.toLowerCase().includes(q))
      );
    }

    const cards = items
      .map(
        (p) => `
      <div class="phrase-unit">
      <button type="button" class="phrase-card js-phrase" data-copy="${escapeHtml(p.ja || p.romaji)}" aria-label="Flip phrase: ${escapeHtml(p.romaji)}">
        <div class="phrase-inner">
          <div class="phrase-face front">
            <div class="phrase-try">Try saying…</div>
            <div class="phrase-ja">${escapeHtml(p.ja || p.romaji)}</div>
            <div class="phrase-romaji">${escapeHtml(p.romaji)}</div>
            <div class="phrase-hint">👆 Tap to flip!</div>
          </div>
          <div class="phrase-face back">
            <div class="phrase-try">You said it!</div>
            <div class="phrase-en">${escapeHtml(p.en)}</div>
            <div class="phrase-romaji">${escapeHtml(p.romaji)}</div>
            <div class="phrase-ja" style="font-size:1.1rem;margin-top:6px">${escapeHtml(p.ja || '')}</div>
          </div>
        </div>
      </button>
      <div class="phrase-tools">
        <button type="button" class="btn btn-sm btn-ghost js-copy" style="background:#fff;color:var(--ink);border:1px solid var(--border)" data-copy="${escapeHtml(p.ja || p.romaji)}">Copy Japanese</button>
      </div>
      </div>`
      )
      .join('');

    el.innerHTML = `
      <div class="card">
        <h2>Say it like a pro 🎤</h2>
        <p>${escapeHtml(DATA.phrases.pronunciationTip)}</p>
      </div>
      <div class="search-row">
        <label class="sr-only" for="phrase-search">Search phrases</label>
        <input id="phrase-search" type="search" placeholder="Find a phrase…" value="${escapeHtml(phraseQuery)}" autocomplete="off">
      </div>
      <div class="cat-tabs" role="tablist">${chips}</div>
      <div class="phrase-grid">${cards || '<p class="muted">No matches — try another word!</p>'}</div>`;

    el.querySelector('#phrase-search').addEventListener('input', (e) => {
      phraseQuery = e.target.value;
      renderPhrases();
      const input = document.getElementById('phrase-search');
      if (input) {
        input.focus();
        const len = input.value.length;
        input.setSelectionRange(len, len);
      }
    });
    el.querySelectorAll('.js-cat').forEach((btn) => {
      btn.addEventListener('click', () => {
        phraseCat = btn.dataset.cat;
        renderPhrases();
      });
    });
    el.querySelectorAll('.js-phrase').forEach((card) => {
      card.addEventListener('click', () => card.classList.toggle('flipped'));
    });
    el.querySelectorAll('.js-copy').forEach((btn) => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const text = btn.dataset.copy;
        try {
          await navigator.clipboard.writeText(text);
          const prev = btn.textContent;
          btn.textContent = 'Copied!';
          setTimeout(() => (btn.textContent = prev), 1200);
        } catch {
          btn.textContent = 'Copy failed';
        }
      });
    });
  }

  function renderStays() {
    const el = document.getElementById('panel-stays');
    const stays = DATA.stays
      .map((s) => {
        const map = mapsLink(s.mapsQuery, s.mapsUrl);
        const photoHtml = renderPlacePhoto(s.mapsQuery, s.mapsUrl, s.name);
        return `
        <article class="card stay-card">
          <h3>${escapeHtml(s.name)} ${statusPill(s.status)}</h3>
          ${photoHtml}
          <p class="muted">${escapeHtml(s.area)} · ${escapeHtml(s.nights)}</p>
          <p class="kv"><span>Check-in:</span> ${escapeHtml(s.checkIn)}</p>
          <p class="kv"><span>Checkout:</span> ${escapeHtml(s.checkOut)}</p>
          ${s.notes ? `<p class="item-detail">${linkify(s.notes)}</p>` : ''}
          ${s.mismatch ? `<div class="callout">${escapeHtml(s.mismatch)}</div>` : ''}
          <div class="item-actions">
            ${map ? `<a class="btn btn-sm btn-primary" href="${escapeHtml(map)}" target="_blank" rel="noopener noreferrer">Open Maps</a>` : ''}
            <a class="btn btn-sm btn-ghost" style="background:#fff;color:var(--ink);border:1px solid var(--border)" href="${escapeHtml(searchLink(s.mapsQuery))}" target="_blank" rel="noopener noreferrer">Google</a>
          </div>
        </article>`;
      })
      .join('');

    const trains = DATA.trains
      .map((t) => {
        return `
        <article class="card">
          <h3>${escapeHtml(t.label)} ${statusPill(t.status)}</h3>
          <p class="muted">${escapeHtml(t.date)}</p>
          <p class="kv"><span>From:</span> ${escapeHtml(t.from)}</p>
          <p class="kv"><span>To:</span> ${escapeHtml(t.to)}</p>
          <p class="kv"><span>Seats:</span> ${escapeHtml(t.car)}</p>
          ${t.notes ? `<p class="item-detail">${linkify(t.notes)}</p>` : ''}
          ${t.mismatch ? `<div class="callout">${escapeHtml(t.mismatch)}</div>` : ''}
        </article>`;
      })
      .join('');

    el.innerHTML = `
      <h2 class="sr-only">Hotels & trains</h2>
      <p style="margin-top:0">Hotels below are the real booked ones. Big train seats are planned — tickets still to buy.</p>
      ${stays}
      <h2 style="font-size:1.15rem;margin:18px 0 8px">🚂 Trains</h2>
      ${trains}`;
  }

  function renderParty() {
    const el = document.getElementById('panel-party');
    const notes = (DATA.party.notes || [])
      .map((n) => `<li>${linkify(n)}</li>`)
      .join('');
    const pri = (DATA.party.priorities || [])
      .map(
        (p) =>
          `<li><strong>${escapeHtml(p.who)}:</strong> ${escapeHtml(p.what)}</li>`
      )
      .join('');
    const members = (DATA.party.members || [])
      .map((name, i) => `<li class="crew-member"><span class="crew-num">${i + 1}</span>${escapeHtml(name)}</li>`)
      .join('');
    el.innerHTML = `
      <div class="card">
        <h2>🎪 The circus crew</h2>
        <p class="muted">${escapeHtml(DATA.party.party)}</p>
        ${members ? `<ol class="crew-list">${members}</ol>` : ''}
      </div>
      <div class="card">
        <h2>Crew notes</h2>
        <ul>${notes}</ul>
      </div>
      <div class="card">
        <h2>Wish list</h2>
        <ul>${pri}</ul>
      </div>
      <div class="card">
        <h2>Useful links</h2>
        <div class="item-actions" style="flex-direction:column;align-items:stretch">
          <a class="btn btn-primary" href="${escapeHtml(DATA.meta.docUrl)}" target="_blank" rel="noopener noreferrer">Edit Doc (shared plan)</a>
          <a class="btn btn-ghost" style="background:#fff;color:var(--ink);border:1px solid var(--border)" href="${escapeHtml(DATA.links.kansaiPassVideo)}" target="_blank" rel="noopener noreferrer">Kansai Wide Area Pass video</a>
          <a class="btn btn-ghost" style="background:#fff;color:var(--ink);border:1px solid var(--border)" href="${escapeHtml(DATA.links.amanohashidateVideo1)}" target="_blank" rel="noopener noreferrer">Amanohashidate video 1</a>
          <a class="btn btn-ghost" style="background:#fff;color:var(--ink);border:1px solid var(--border)" href="${escapeHtml(DATA.links.amanohashidateVideo2)}" target="_blank" rel="noopener noreferrer">Amanohashidate video 2</a>
          <a class="btn btn-ghost" style="background:#fff;color:var(--ink);border:1px solid var(--border)" href="${escapeHtml(DATA.links.zakuKnives)}" target="_blank" rel="noopener noreferrer">Zaku Knives</a>
        </div>
      </div>`;
  }

  const panels = {
    today: renderToday,
    itinerary: renderItinerary,
    phrases: renderPhrases,
    stays: renderStays,
    party: renderParty
  };

  function showPanel(name) {
    document.querySelectorAll('.panel').forEach((p) => {
      p.classList.toggle('active', p.id === `panel-${name}`);
    });
    document.querySelectorAll('.nav-tabs button').forEach((b) => {
      b.setAttribute('aria-selected', b.dataset.panel === name ? 'true' : 'false');
    });
    if (panels[name]) panels[name]();
    try {
      sessionStorage.setItem('cvj-tab', name);
    } catch { /* ignore */ }
  }

  function init() {
    document.getElementById('doc-btn').href = DATA.meta.docUrl;
    document.getElementById('last-synced').textContent = DATA.meta.lastSynced;
    document.getElementById('banner-text').textContent = DATA.meta.banner;

    document.querySelectorAll('.nav-tabs button').forEach((btn) => {
      btn.addEventListener('click', () => showPanel(btn.dataset.panel));
    });

    let start = 'today';
    try {
      start = sessionStorage.getItem('cvj-tab') || 'today';
    } catch { /* ignore */ }
    showPanel(start);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

  </script>
</body>
</html>
