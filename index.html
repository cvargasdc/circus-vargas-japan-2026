<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#26345a">
  <meta name="description" content="Circus Vargas Goes to Japan — family trip companion Oct 9–18, 2026.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Circus Vargas Goes to Japan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AA%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="app-header">
    <h1><span class="hanko-seal" lang="ja" aria-hidden="true">旅</span><span>Circus Vargas Goes to Japan</span></h1>
    <p class="jp-sub" lang="ja">サーカス・バルガス　日本の旅</p>
    <p class="tagline">🎪 Family adventure · Oct 9–18, 2026 · 🇯🇵</p>
    <div class="header-actions">
      <a id="doc-btn" class="btn btn-primary" href="#" target="_blank" rel="noopener noreferrer">Edit Doc</a>
    </div>
  </header>

  <div class="banner" role="status">
    <strong>Note:</strong> <span id="banner-text">Shared edits happen in the Google Doc; checkmarks on this phone only.</span>
  </div>

  <main>
    <section id="panel-today" class="panel active" aria-label="Today"></section>
    <section id="panel-itinerary" class="panel" aria-label="All the days"></section>
    <section id="panel-phrases" class="panel" aria-label="Say it"></section>
    <section id="panel-stays" class="panel" aria-label="Hotels and trains"></section>
    <section id="panel-party" class="panel" aria-label="Crew"></section>
    <section id="panel-jetlag" class="panel" aria-label="Jet Lag: Coming Home"></section>
  </main>

  <footer class="app-footer">
    Last synced: <span id="last-synced">—</span>
    · Public companion · no secrets stored here
  </footer>

  <nav class="nav-tabs" aria-label="Primary">
    <button type="button" data-panel="today" aria-selected="true"><span class="ico" aria-hidden="true">📅</span>Today<span class="jp" lang="ja" aria-hidden="true">今日</span></button>
    <button type="button" data-panel="itinerary" aria-selected="false"><span class="ico" aria-hidden="true">🗺️</span>Days<span class="jp" lang="ja" aria-hidden="true">日程</span></button>
    <button type="button" data-panel="phrases" aria-selected="false"><span class="ico" aria-hidden="true">💬</span>Say it!<span class="jp" lang="ja" aria-hidden="true">言葉</span></button>
    <button type="button" data-panel="stays" aria-selected="false"><span class="ico" aria-hidden="true">🏨</span>Hotels<span class="jp" lang="ja" aria-hidden="true">宿</span></button>
    <button type="button" data-panel="party" aria-selected="false"><span class="ico" aria-hidden="true">🎪</span>Crew<span class="jp" lang="ja" aria-hidden="true">仲間</span></button>
    <button type="button" data-panel="jetlag" aria-selected="false"><span class="ico" aria-hidden="true">🛬</span>Jet lag<span class="jp" lang="ja" aria-hidden="true">時差</span></button>
  </nav>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="phrase-audio.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
